{% extends 'base.html' %}

{% block title %}Register - Thefacebook{% endblock %}

{% block content %}
<div class="content-box narrow-box">
    <div class="box-title">Register for Thefacebook</div>
    <p class="small-note">Registration is limited to Harvard University students. Use your school information to create a profile.</p>
    <form method="post">
        {% csrf_token %}
        <table class="form-table full-form">
            <tr><td>Username:</td><td><input type="text" name="username" required></td></tr>
            <tr><td>Email:</td><td><input type="email" name="email" placeholder="name@harvard.edu" required></td></tr>
            <tr><td>Password:</td><td><input type="password" name="password1" required></td></tr>
            <tr><td>Confirm:</td><td><input type="password" name="password2" required></td></tr>
            <tr><td></td><td><button type="submit">register</button></td></tr>
        </table>
    </form>
</div>
{% endblock %}
